# IBKR Dashboard - nginx site 模板（多后端服务）
# 用法：复制到 /etc/nginx/sites-available/，软链到 sites-enabled，nginx -t 后 reload。
# 安全头放 server 级；注意：location 里一旦出现 add_header 会吞掉外层的头，勿在 location 重复。

# 多服务设计：每个后端容器只绑定宿主机 127.0.0.1:PORT，
# nginx 按路径把请求分流到对应端口。加新服务 = 加一个 location。
upstream dashboard {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name dashboard.example.com;   # ← 改成你的域名

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Basic Auth（强烈建议，零前端改动，保护整站含所有 API）：
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd dashboard   # 生成后去掉下面两行注释
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # —— 主应用（仪表板 + /api/*）——
    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IBKR GetStatement 有 4 次重试 + 间隔，放宽上游超时
        proxy_read_timeout 120s;
    }

    # —— 实时行情 SSE（长桥 WS → 浏览器 EventSource）——
    location /api/stream {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # 关键：事件立即下发，不攒批
        proxy_cache off;
        proxy_read_timeout 3600s;      # 25s 心跳保活，长连接不断
    }

    # —— 第二个后端服务示例（以后加了 service-b 容器在 3001 端口时启用）——
    # location /api/v2/ {
    #     proxy_pass http://127.0.0.1:3001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 120s;
    # }

    # 健康检查供监控探测，单独放行 Basic Auth
    location = /healthz {
        auth_basic off;
        proxy_pass http://dashboard;
        proxy_set_header Host $host;
    }
}

# HTTPS 用 certbot 自动配置：sudo certbot --nginx -d dashboard.example.com
